[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appletv-mcp"
version = "0.2.0"
description = "Apple TV MCP: local MCP server for semantic Apple TV control via pyatv."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [{ name = "Trevor Nichols" }]
keywords = ["apple-tv", "mcp", "pyatv", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp[cli]==2.2.0",
    "pyatv==0.18.0",
    "pydantic>=2.12,<3",
    "platformdirs>=4.3,<5",
]

[project.scripts]
appletv-mcp = "appletv_mcp.interfaces.cli.main:main"

[project.urls]
Homepage = "https://github.com/trevor-nichols/appletv-mcp"
Repository = "https://github.com/trevor-nichols/appletv-mcp"
Documentation = "https://github.com/trevor-nichols/appletv-mcp"
Changelog = "https://github.com/trevor-nichols/appletv-mcp/releases"
Issues = "https://github.com/trevor-nichols/appletv-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.12",
    "pyright>=1.1.406",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: requires a paired Apple TV on the local network",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "ICN",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RUF",
    "SIM",
    "SLOT",
    "T20",
    "TC",
    "UP",
    "W",
]
ignore = [
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLC0415",
    # Pydantic models and Protocol signatures need these types at runtime.
    "TC001",
    "TC002",
    "TC003",
    # `timeout` is a duration matching pyatv.scan, not asyncio.timeout.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PLC0415", "SLF001", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "docs",
]
reportDeprecated = false
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownLambdaType = "warning"
reportPrivateUsage = false

[tool.hatch.build.targets.wheel]
packages = ["src/appletv_mcp"]

[tool.hatch.build.targets.sdist]
# The screenshot helper is a separate project with its own lockfile and license footprint.
# Upstream reference docs are local-only and are not redistributed.
exclude = ["sidecars", "docs/references"]
